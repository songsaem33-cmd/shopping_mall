<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <title>주문 / 결제</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f8f8f8;
        }

        .pay-box {
            max-width: 700px;
            margin: 80px auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
        }

        .price {
            font-size: 32px;
            font-weight: bold;
        }
    </style>

</head>

<body>

    <div class="pay-box">

        <h2 class="mb-4">
            주문 / 결제
        </h2>

        <hr>

        <h4>
            상품명
        </h4>

        <p>
            {{ product.name }}
        </p>

        <h4 class="mt-4">
            결제금액
        </h4>

        <div class="price">
            {{ product.price }}
        </div>

        <hr>

        <a href="/order/{{ product_id }}" class="btn btn-success btn-lg w-100">
            결제하기
        </a>

    </div>

</body>

</html>
