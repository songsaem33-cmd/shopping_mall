<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SONG MAN SHOP</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white;
            color: #222;
        }

        .navbar {
            background-color: white;
            border-bottom: 1px solid #eee;
            padding: 20px 0;
        }

        .navbar-brand {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .nav-link {
            color: #222 !important;
            margin-left: 20px;
        }

        .nav-link:hover {
            color: gray !important;
        }

        .hero {
            position: relative;
            width: 100%;
            height: 700px;
            overflow: hidden;
        }

        .hero img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hero-text {
            position: absolute;
            top: 50%;
            left: 10%;
            transform: translateY(-50%);
            color: white;
        }

        .hero-text h1 {
            font-size: 60px;
            font-weight: bold;
        }

        .hero-text p {
            font-size: 20px;
        }

        .section-title {
            text-align: center;
            margin-top: 80px;
            margin-bottom: 50px;
            font-size: 32px;
            font-weight: bold;
        }

        .product-card {
            transition: 0.3s;
        }

        .product-card:hover {
            transform: translateY(-8px);
        }

        .product-img {
            width: 100%;
            height: 420px;
            object-fit: cover;
        }

        .product-info {
            padding-top: 15px;
        }

        .product-name {
            font-size: 17px;
            margin-bottom: 8px;
        }

        .product-price {
            color: #666;
        }

        footer {
            margin-top: 100px;
            padding: 40px 0;
            text-align: center;
            background: #f8f8f8;
        }
    </style>

</head>

<body>

    <nav class="navbar navbar-expand-lg">

        <div class="container">

            <a class="navbar-brand" href="/">
                SONG MAN
            </a>

            <div class="collapse navbar-collapse justify-content-end">

                <ul class="navbar-nav">

                    <li class="nav-item">
                        <a class="nav-link" href="/top">상의</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/pants">하의</a>
                    </li>

                    {% if userid %}

                    <li class="nav-item">
                        <span class="nav-link">
                            {{ userid }}님 환영합니다
                        </span>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/logout">
                            로그아웃
                        </a>
                    </li>

                    {% else %}

                    <li class="nav-item">
                        <a class="nav-link" href="/login">
                            로그인
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/signup">
                            회원가입
                        </a>
                    </li>

                    {% endif %}

                </ul>
            </div>

        </div>

    </nav>

    <section class="hero">

        <img src="https://picsum.photos/1920/900?fashion">

        <div class="hero-text">
            <h1>2026 SUMMER</h1>
            <p>MINIMAL MEN'S LOOK</p>
        </div>

    </section>

    <div class="container">

        <h2 class="section-title">
            BEST ITEM
        </h2>

        <div class="row">

            <div class="col-md-4 mb-5">

                <div class="product-card">

                    <a href="/detail">
                        <img src="/static/images/img1.jpg" class="product-img">
                    </a>

                    <div class="product-info">

                        <div class="product-name">
                            오버핏 반팔 셔츠
                        </div>

                        <div class="product-price">
                            49,000원
                        </div>

                        <div class="product-rating">
                            ★★★★★
                        </div>

                    </div>

                </div>

            </div>

            <div class="col-md-4 mb-5">

                <div class="product-card">

                    <a href="/detail">
                        <img src="/static/images/img2.jpg" class="product-img">
                    </a>

                    <div class="product-info">

                        <div class="product-name">
                            와이드 데님 팬츠
                        </div>

                        <div class="product-price">
                            59,000원
                        </div>

                        <div class="product-rating">
                            ★★★★★
                        </div>

                    </div>

                </div>

            </div>

            <div class="col-md-4 mb-5">

                <div class="product-card">

                    <a href="/detail">
                        <img src="/static/images/img3.jpg" class="product-img">
                    </a>

                    <div class="product-info">

                        <div class="product-name">
                            미니멀 블레이저
                        </div>

                        <div class="product-price">
                            89,000원
                        </div>

                        <div class="product-rating">
                            ★★★★★
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <footer>
        © 2026 SONG MAN SHOP
    </footer>

</body>

</html>
