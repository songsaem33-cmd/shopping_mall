<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>장바구니</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-5">

        <h1>장바구니</h1>

        <hr>

        {% for item in cart %}

        <div class="card p-3 mb-3">

            <h4>{{ item.name }}</h4>

            <p>{{ item.price }}</p>

        </div>

        {% endfor %}

        <a href="/pay" class="btn btn-dark">
            결제하기
        </a>

    </div>

</body>

</html>
