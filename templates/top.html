<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상의</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff;
        }

        .title {
            text-align: center;
            margin: 60px 0;
            font-size: 40px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        .product-card {
            transition: 0.3s;
        }

        .product-card:hover {
            transform: translateY(-8px);
        }

        .product-img {
            width: 100%;
            height: 420px;
            object-fit: cover;
        }

        .product-name {
            margin-top: 15px;
            font-size: 18px;
        }

        .product-price {
            color: gray;
        }
    </style>

</head>

<body>

    <div class="container">

        <div class="title">
            TOP
        </div>

        <div class="row">

            <!-- 상품 1 -->

            <div class="col-md-4 mb-5">

                <div class="product-card">

                    <a href="/detail/4">
                        <img src="/static/images/img4.jpg" class="product-img">
                    </a>

                    </a>

                    <div class="product-name">
                        오버핏 셔츠
                    </div>

                    <div class="product-price">
                        39,000원
                    </div>

                    <div class="product-rating">
                        ★★★★★
                    </div>

                </div>

            </div>

            <!-- 상품 2 -->

            <div class="col-md-4 mb-5">

                <div class="product-card">

                    <a href="/detail/5">
                        <img src="/static/images/img5.jpg" class="product-img">
                    </a>
                    </a>

                    <div class="product-name">
                        미니멀 니트
                    </div>

                    <div class="product-price">
                        49,000원
                    </div>

                    <div class="product-rating">
                        ★★★★★
                    </div>

                </div>

            </div>

            <!-- 상품 3 -->

            <div class="col-md-4 mb-5">

                <div class="product-card">

                    <a href="/detail/6">
                        <img src="/static/images/img6.jpg" class="product-img">
                    </a>

                    </a>

                    <div class="product-name">
                        반팔 티셔츠
                    </div>

                    <div class="product-price">
                        29,000원
                    </div>

                    <div class="product-rating">
                        ★★★★★
                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
