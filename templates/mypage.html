<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <title>마이페이지</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

    <div class="container mt-5">

        <h1>
            {{ userid }}님의 마이페이지
        </h1>

        <hr>

        <h3>
            주문 내역
        </h3>

        {% if orders %}

        {% for order in orders %}

        <div class="card p-3 mt-3">

            <h5>
                {{ order[0] }}
            </h5>

            <p>
                {{ order[1] }}
            </p>

        </div>

        {% endfor %}

        {% else %}

        <div class="alert alert-secondary mt-3">

            주문 내역이 없습니다.

        </div>

        {% endif %}

    </div>

</body>

</html>
