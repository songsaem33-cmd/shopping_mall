<!DOCTYPE html>
<html lang="ko">

<head>

    <title>하의</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

            margin-top: 15px;

        .product-price {

</head>

                </a>

                    와이드 슬랙스
                </div>

                <div class="product-price">

            </div>

            <!-- 상품 2 -->

                    <img src="/static/images/img8.jpg" class="product-img">
                </a>

            <!-- 상품 3 -->

            <div class="col-md-4">
