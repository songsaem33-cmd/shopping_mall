<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>상품 상세</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #fff;
        }

        .product-section {
            margin-top: 80px;
        }

        .product-image {
            width: 100%;
            border-radius: 10px;
        }

        .product-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .product-price {
            font-size: 28px;
            font-weight: bold;
            color: #111;
            margin-bottom: 30px;
        }

        .product-desc {
            color: #666;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .size-btn {
            margin-right: 10px;
            margin-bottom: 10px;
        }

        .quantity-box {
            width: 100px;
            margin-bottom: 25px;
        }

        .buy-btn {
            width: 100%;
            height: 55px;
            font-size: 18px;
            font-weight: 500;
            margin-top: 10px;
        }

        .cart-btn {
            width: 100%;
            height: 55px;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .badge-best {
            background: black;
            color: white;
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 15px;
        }

        .product-info-box {
            padding-left: 40px;
        }

        .delivery-info {
            background-color: #f8f8f8;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .review-score {
            color: #ffb400;
            font-size: 18px;
            margin-bottom: 15px;
        }

        .product-image {
            transition: 0.4s;
        }

        .product-image:hover {
            transform: scale(1.02);
        }

        .buy-btn {
            border-radius: 0;
        }

        .cart-btn {
            border-radius: 0;
        }
    </style>

</head>

<body>

    <div class="container product-section">

        <div class="row">

            <!-- 상품 이미지 -->

            <div class="col-md-6">

                <img src="/static/images/{{ product.image }}" class="product-image">

            </div>

            <!-- 상품 정보 -->

            <div class="col-md-6 product-info-box">

                <div class="badge-best">
                    BEST ITEM
                </div>

                <div class="product-title">
                    {{ product.name }}
                </div>

                <div class="review-score">
                    ★★★★★ 4.9 (128)
                </div>

                <div class="product-price">
                    {{ product.price }}
                </div>

                <div class="delivery-info">
                    🚚 오늘출발 · 무료배송
                </div>

                <div class="product-desc">
                    미니멀한 디자인과 편안한 착용감을 제공하는
                    프리미엄 상품입니다.
                    데일리룩, 출근룩, 데이트룩 어디에나 잘 어울립니다.
                </div>

                <h6>사이즈 선택</h6>

                <button class="btn btn-outline-dark size-btn">M</button>
                <button class="btn btn-outline-dark size-btn">L</button>
                <button class="btn btn-outline-dark size-btn">XL</button>

                <hr>

                <h6>수량</h6>

                <input type="number" class="form-control quantity-box" value="1" min="1">

                <a href="/add_cart/{{ product_id }}" class="btn btn-outline-dark cart-btn">
                    장바구니 담기
                </a>

                <button class="btn btn-dark buy-btn" onclick="location.href='/pay'">
                    바로 구매하기
                </button>

            </div>

</body>

</html>
