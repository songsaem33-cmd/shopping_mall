<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SONG MAN SHOP</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- 폰트 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #222;
        }

        /* 상단 메뉴 */

        .navbar {
            background-color: white;
            border-bottom: 1px solid #eee;
            padding: 20px 0;
        }

        .navbar-brand {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .nav-link {
            color: #222 !important;
            margin-left: 20px;
            font-size: 15px;
        }

        .nav-link:hover {
            color: gray !important;
        }

        /* 메인 배너 */

        .hero {
            position: relative;
            width: 100%;
            height: 700px;
            overflow: hidden;
        }

        .hero img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hero-text {
            position: absolute;
            top: 50%;
            left: 10%;
            transform: translateY(-50%);
            color: white;
        }

        .hero-text h1 {
            font-size: 60px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .hero-text p {
            font-size: 20px;
            letter-spacing: 2px;
        }

        /* 상품 영역 */

        .section-title {
            text-align: center;
            margin-top: 80px;
            margin-bottom: 50px;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        .product-card {
            border: none;
            transition: 0.3s;
        }

        .product-card:hover {
            transform: translateY(-8px);
        }

        .product-img {
            width: 100%;
            height: 420px;
            object-fit: cover;
        }

        .product-info {
            padding-top: 15px;
        }

        .product-name {
            font-size: 17px;
            margin-bottom: 8px;
        }

        .product-price {
            color: #666;
        }

        /* 푸터 */

        footer {
            margin-top: 100px;
            padding: 40px 0;
            text-align: center;
            background-color: #f8f8f8;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <!-- 상단 메뉴 -->

    <nav class="navbar navbar-expand-lg">

        <div class="container">

            <a class="navbar-brand" href="#">
                SONG MAN
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse justify-content-end" id="menu">

                <ul class="navbar-nav">

                    <li class="nav-item">
                        <a class="nav-link" href="top.html">
                            상의
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="pant.html">
                            하의
                        </a>

                    <li class="nav-item">
                        <a class="nav-link" href="login.html">
                            로그인
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="signup.html">
                            회원가입
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <!-- 메인 배너 -->

    <section class="hero">

        <img src="https://picsum.photos/1920/900?fashion">

        <div class="hero-text">

            <h1>
                2026 SUMMER
            </h1>

            <p>
                MINIMAL MEN'S LOOK
            </p>

        </div>

    </section>


    <!-- 상품 섹션 -->

    <div class="container">

        <h2 class="section-title">
            BEST ITEM
        </h2>

        <div class="row">

            <!-- 상품 1 -->

            <div class="col-md-4 mb-5">

                <div class="product-card">

                    <a href="detail.html">

                        <img src="https://picsum.photos/500/700?man1" class="product-img">

                    </a>

                    <div class="product-info">

                        <div class="product-name">
                            오버핏 반팔 셔츠
                        </div>

                        <div class="product-price">
                            49,000원
                        </div>

                    </div>

                </div>

            </div>


            <!-- 상품 2 -->

            <div class="col-md-4 mb-5">

                <div class="product-card">

                    <img src="https://picsum.photos/500/700?man2" class="product-img">

                    <div class="product-info">

                        <div class="product-name">
                            와이드 데님 팬츠
                        </div>

                        <div class="product-price">
                            59,000원
                        </div>

                    </div>

                </div>

            </div>


            <!-- 상품 3 -->

            <div class="col-md-4 mb-5">

                <div class="product-card">

                    <img src="https://picsum.photos/500/700?man3" class="product-img">

                    <div class="product-info">

                        <div class="product-name">
                            미니멀 블레이저
                        </div>

                        <div class="product-price">
                            89,000원
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>



    <!-- 푸터 -->

    <footer>

        © 2026 SONG MAN SHOP

    </footer>

</body>

</html>
